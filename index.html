
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10101c">
    <title>HTML.ADVENTURE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">

        <header>
            <h1>ADVENTURE</h1>
            <div id="connection">Connecting...</div>
        </header>

        <div id="device-picker">
            <span>DEVICE:</span>
            <button id="desktop-mode">DESKTOP</button>
            <button id="mobile-mode">MOBILE</button>
        </div>

        <div id="room-info">GREENFIELD VILLAGE</div>

        <div id="interaction-hint"></div>

        <div id="game-stage">
            <canvas id="game"></canvas>

            <div id="mobile-controls">
                <div id="joystick-zone">
                    <div id="joystick-base">
                        <div id="joystick-knob"></div>
                    </div>
                </div>

                <button id="interact-button">INTERACT</button>
            </div>
        </div>

        <div id="rotate-overlay">
            <div class="rotate-content">
                <div class="rotate-icon">📱</div>
                <h2>ROTATE YOUR DEVICE</h2>
                <p>HTML.ADVENTURE is designed for landscape mode.</p>
            </div>
        </div>

        <footer>
            <span id="control-hint">WASD / Arrows — Move | E — Interact</span>
            <span id="player-count">Players: 1</span>
        </footer>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="client/main.js"></script>

</body>
</html>
