
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10101c">
    <title>HTML.ADVENTURE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">

        <header>
            <h1>ADVENTURE</h1>
            <div id="connection">Connecting...</div>
        </header>

        <div id="device-picker">
            <span>DEVICE:</span>
            <button id="desktop-mode">DESKTOP</button>
            <button id="mobile-mode">MOBILE</button>
        </div>

        <div id="room-info">GREENFIELD VILLAGE</div>

        <div id="interaction-hint"></div>

        <canvas id="game"></canvas>

        <div id="mobile-controls">
            <div class="dpad">
                <button data-dir="up">▲</button>

                <div class="middle-controls">
                    <button data-dir="left">◀</button>
                    <button data-dir="right">▶</button>
                </div>

                <button data-dir="down">▼</button>
            </div>

            <button id="interact-button">INTERACT</button>
        </div>

        <footer>
            <span id="control-hint">WASD / Arrows — Move | E — Interact</span>
            <span id="player-count">Players: 1</span>
        </footer>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="client/main.js"></script>

</body>
</html>
